name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MODEL_PROVIDER: fake
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-live.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m timex.cli --csv examples/demo_events.csv --format json --output outputs/ci-result.json
      - run: python -m timex.cli --baseline --output outputs/baseline.json
      - run: python -m timex.cli --compare --format json --output outputs/comparison.json
